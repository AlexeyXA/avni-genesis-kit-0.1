[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avni-genesis-kit"
version = "0.1.1"
description = "Reproducible packaging, restoration, verification and lineage for Python AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AVNI Project" }]
keywords = ["ai-agents", "reproducibility", "provenance", "agent-lifecycle"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
signing = ["cryptography>=41"]
dev = ["pytest>=8"]

[project.scripts]
avni = "avni.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
